# Integration reference only. Pin versions before production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: portless
      POSTGRES_USER: portless
      POSTGRES_DB: portless
    ports:
      - "5432:5432"
    volumes:
      - portless-postgres:/var/lib/postgresql/data

  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"

  nomad:
    image: hashicorp/nomad:latest
    command: agent -dev -bind=0.0.0.0 -client
    privileged: true
    ports:
      - "4646:4646"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  traefik:
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.consulcatalog.endpoint.address=consul:8500
      - --entrypoints.web.address=:80
    ports:
      - "8080:8080"
      - "8081:80"
    depends_on:
      - consul

volumes:
  portless-postgres:
