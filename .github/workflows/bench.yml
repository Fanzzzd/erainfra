name: EraInfra executor benchmark

# Runs .github/bench/bench.sh on `ubuntu-latest` and on a Linux Profile, twice
# each, so a slow job can be attributed to CPU, disk, or the executor instead
# of argued about. The Docker leg of the same comparison runs on a Worker host
# by hand; see the issue that dispatched this run. The default Profile is
# rc-e2e because that is the scale set registered on this repository;
# rc-linux-js is registered on its consumer's. Triggers only when the
# benchmark itself changes, or by hand once this file is on the default branch.
on:
  pull_request:
    paths:
      - .github/bench/**
      - .github/workflows/bench.yml
  workflow_dispatch:
    inputs:
      profile:
        description: The EraInfra Profile to benchmark against ubuntu-latest
        default: rc-e2e
        required: true

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.leg }} run ${{ matrix.repeat }}
    runs-on: ${{ matrix.leg == 'hosted' && 'ubuntu-latest' || inputs.profile || 'rc-e2e' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        leg: [hosted, profile]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache:` on either action: a warm dependency cache on one leg would
      # measure actions/cache, not the machine.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The major only, not .nvmrc: the Image Release's toolcache holds one Node 22 patch,
      # and an exact pin it does not hold would add a download to one leg's measurement.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Egress probe
        run: sh .github/bench/netprobe.sh "${{ matrix.leg }}-${{ matrix.repeat }}"
      - name: Benchmark
        run: sh .github/bench/bench.sh "${{ matrix.leg }}-${{ matrix.repeat }}"
