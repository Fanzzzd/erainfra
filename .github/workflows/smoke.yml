name: EraInfra smoke

on:
  workflow_dispatch:
  schedule:
    # Daily canary: proves the live path from scale-set listener through an
    # Attempt, scheduler, agent, and the executor's in-job contract. Post-job
    # teardown and the Firecracker production gate require separate evidence.
    # A red run here means the fleet or control plane lost capability.
    - cron: "17 2 * * *"

jobs:
  smoke:
    runs-on: erainfra-canary-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Assert the executor contract
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME arch=$(uname -m) kernel=$(uname -r)"
          # Ephemeral: every job starts in an empty workspace.
          [ -z "$(ls -A "$GITHUB_WORKSPACE")" ]
          # Not privileged: a privileged container would hold CAP_SYS_ADMIN.
          cap=$(awk '/^CapEff:/ { print "0x" $2 }' /proc/self/status)
          [ $(( cap & (1 << 21) )) -eq 0 ]
          # Read the mount table once; an unreadable table fails the canary
          # instead of silently passing the probes below.
          mounts=$(cat /proc/self/mountinfo)
          [ -n "$mounts" ]
          # No Docker control socket is reachable at any mounted path.
          if grep -q 'docker\.sock' <<<"$mounts"; then
            echo "Docker control socket is mounted" >&2
            exit 1
          fi
          # No host bind mounts or shared volumes: apart from the root
          # filesystem, the only disk-backed mounts a clean executor carries
          # are Docker's standard /etc file trio and the read-only tini
          # binary Docker itself injects for --init.
          unexpected=$(awk '{ for (i = 7; i <= NF; i++) if ($i == "-") { print $(i + 1), $5; break } }' <<<"$mounts" \
            | awk '$1 ~ /^(ext[234]|xfs|btrfs|zfs)$/ { print $2 }' \
            | { grep -vE '^/(etc/(hosts|hostname|resolv\.conf)|usr/sbin/docker-init)?$' || true; })
          [ -z "$unexpected" ] || { echo "unexpected host mounts: $unexpected"; exit 1; }
          # Scratch space is writable.
          probe=$(mktemp -d) && touch "$probe/ok" && rm -rf "$probe"
          # localhost resolves. A Firecracker rootfs comes from a container image
          # whose /etc/hosts is empty, and test runners that bind or dial
          # localhost fail at startup without it. The IPv6 entry is checked in
          # the hosts database, not with ahostsv6: guests run with IPv6
          # disabled, and getaddrinfo's AI_ADDRCONFIG then drops ::1.
          getent ahostsv4 localhost | grep -q '^127\.0\.0\.1 '
          getent hosts localhost | grep -q '^::1 '
          # Egress works; actions/checkout and tool downloads depend on it.
          curl -fsS -o /dev/null https://api.github.com
          echo "smoke OK"
      # Where a slow checkout spends its time. Measured on 2026-09-07 from
      # both the guest and the Worker host: about a third of new TCP
      # connections to github.com:443 (20.205.243.166, GitHub's Singapore
      # edge) get no SYN-ACK for a fixed 30 or 60 s window, then complete
      # normally; the API, codeload and GHCR edges in the same /29, npm,
      # Cloudflare and Convex never stall, and the same probe from
      # oracle-singapore-1 never stalls. That is ubuntu0's uplink, not the
      # fleet, and it is what #137's checkout minutes were. The connect
      # column is the one that shows it. Informational: the assertion is
      # the bounded checkout below, so a failed probe is recorded, not fatal.
      - name: Time the egress path
        run: |
          set -uo pipefail
          fmt='%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total} %{size_download} %{speed_download}\n'
          {
            printf '\n### egress timing (seconds; bytes; bytes/s)\n\n'
            printf '| target | lookup | connect | tls | first byte | total | bytes | speed |\n|---|---|---|---|---|---|---|---|\n'
            for target in https://api.github.com/ https://codeload.github.com/Fanzzzd/erainfra/tar.gz/refs/heads/main https://github.com/Fanzzzd/erainfra/info/refs?service=git-upload-pack; do
              line=$(curl -sS -o /dev/null --connect-timeout 150 -w "$fmt" "$target" 2>&1 | tail -1 || true)
              printf '| %s | %s |\n' "${target#https://}" "$(printf '%s' "$line" | tr ' ' '|')"
            done
            start=$(date +%s.%N)
            if git ls-remote --quiet https://github.com/Fanzzzd/erainfra HEAD >/dev/null 2>&1; then outcome=ok; else outcome=FAILED; fi
            printf '| git ls-remote | | | | | %s | %s | |\n' "$(awk -v a="$start" -v b="$(date +%s.%N)" 'BEGIN { printf "%.3f", b - a }')" "$outcome"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The one step the consumer's jobs spent their lost minutes in (#137):
      # 154 to 214 s on 2026-08-20 against 19 s hosted. A checkout that takes
      # longer than two minutes is the canary going red, not a slow day.
      - name: Check out within two minutes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: The checkout is complete
        run: |
          set -euo pipefail
          test -f README.md
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD >/dev/null

  # A job with service containers: the runner creates a job network in the
  # guest's dockerd, starts each service, and waits for its health check before
  # the first step. A workflow that moved here from a hosted or Blacksmith label
  # with a `services:` block needs exactly this to work unchanged. Images are
  # pinned by index digest so a moved tag cannot turn the canary red on a day
  # the fleet did not change.
  services:
    runs-on: erainfra-canary-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: The service answered its health check and its published port
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.State.Health.Status}}' "$POSTGRES_ID")" = healthy
          # The job reaches the published port from the guest, the path a test
          # suite's DATABASE_URL=postgres://localhost:5432 takes.
          timeout 30 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 1; done'
          # And the server behind it answers a query, not only a TCP accept.
          test "$(docker exec "$POSTGRES_ID" psql -U postgres -tAc 'select 1')" = 1
      # Compose v2 and Buildx are the two Docker CLI plugins ubuntu-latest
      # carries and a workflow calls without installing. The Image Release adds
      # both (#151); erainfra-canary-4vcpu-ubuntu-2404 measures the image it
      # is pinned to until it is repinned, so until the date below a missing
      # plugin is a warning, and after it the canary goes red. The date matches the conformance
      # allowlist's pending entries for the same two tools.
      - name: The Docker CLI plugins answer
        run: |
          set -uo pipefail
          missing=()
          docker compose version || missing+=(compose)
          docker buildx version || missing+=(buildx)
          [ "${#missing[@]}" -eq 0 ] && exit 0
          if [ "$(date -u +%Y%m%d)" -le 20261205 ]; then
            echo "::warning::Docker CLI plugins missing until erainfra-canary-4vcpu-ubuntu-2404 is repinned to an image with #151: ${missing[*]}"
            exit 0
          fi
          echo "Docker CLI plugins missing: ${missing[*]}" >&2
          exit 1

  # A `container:` job: every step runs inside a container the runner starts in
  # the guest, with a service reached by its name on the job network rather
  # than through a published port.
  container-job:
    runs-on: erainfra-canary-4vcpu-ubuntu-2404
    timeout-minutes: 10
    container:
      # The base of the Image Release itself, at the digest the Dockerfile pins.
      image: docker.io/library/ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    services:
      redis:
        image: docker.io/library/redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: The step runs in the job container and reaches the service by name
        shell: bash
        run: |
          set -euo pipefail
          test -f /.dockerenv
          grep -q '^ID=ubuntu$' /etc/os-release
          # The runner's own Node, mounted into the container, is what every
          # JavaScript action in a container job runs on.
          ls /__e/node*/bin/node >/dev/null
          # A RESP PING over bash's /dev/tcp: no client to install, and a
          # reply only a live Redis gives.
          exec 3<>/dev/tcp/redis/6379
          printf 'PING\r\n' >&3
          IFS= read -r -t 10 reply <&3
          test "$reply" = $'+PONG\r'
