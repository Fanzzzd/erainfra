name: EraInfra runner images

on:
  push:
    branches: [main]
    paths:
      - "apps/runtime/**"
      - "!apps/runtime/package.json"
      - "images/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "apps/runtime/**"
      - "!apps/runtime/package.json"
      - "images/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/images.yml"
      # The Firecracker and guest kernel pins the boot test reads. Only a pull
      # request runs for it: a kernel bump has to boot the image, but it does
      # not change the image, so main publishes nothing for it.
      - "deploy/provision-firecracker-host.sh"
  workflow_dispatch:
  # A weekly rebuild of main from the same source. The Dockerfile pins every
  # tool and the base image by digest, but `apt-get install` takes whatever the
  # Ubuntu archive serves that day, so a rebuild is how security updates to
  # those packages reach the image. It publishes a new digest and changes no
  # pin: a Profile keeps the digest it was given until someone repins it.
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC

permissions: {}

# A push or pull request cancels an older run for the same ref. A scheduled
# rebuild never cancels anything: it waits behind a push's publish instead of
# throwing away that push's sha- tag.
concurrency:
  group: runner-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  validate-ubuntu-24-04-js:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # smoke.sh runs inside the build, with no guest kernel and no dockerd, so
      # it cannot see what only the guest kernel decides. This boots the image
      # in Firecracker on the kernel a Worker pins and starts containers on a
      # user-defined network, as every `container:` and `services:` job does.
      # amd64 only: GitHub's hosted x86_64 runners expose /dev/kvm. The build
      # below reuses this one's layers.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/ubuntu-24.04-js/Dockerfile
          platforms: linux/amd64
          load: true
          tags: erainfra-boot-test:candidate
      - name: Boot the image on the pinned guest kernel
        run: |
          set -euo pipefail
          # /mnt is the runner's large scratch disk; the root image is a few GiB.
          workdir=/mnt/erainfra-boot-test
          sudo mkdir -p "$workdir" || workdir="$RUNNER_TEMP/erainfra-boot-test"
          sudo env BOOT_TEST_WORKDIR="$workdir" \
            images/ubuntu-24.04-js/boot-test.sh erainfra-boot-test:candidate
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/ubuntu-24.04-js/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  publish-ubuntu-24-04-js:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # The same boot test as validate-ubuntu-24-04-js, before the push, so
      # nothing is published that cannot start a container on the guest
      # kernel. The multi-arch build below reuses this build's amd64 layers.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/ubuntu-24.04-js/Dockerfile
          platforms: linux/amd64
          load: true
          tags: erainfra-boot-test:candidate
      - name: Boot the image on the pinned guest kernel
        run: |
          set -euo pipefail
          # /mnt is the runner's large scratch disk; the root image is a few GiB.
          workdir=/mnt/erainfra-boot-test
          sudo mkdir -p "$workdir" || workdir="$RUNNER_TEMP/erainfra-boot-test"
          sudo env BOOT_TEST_WORKDIR="$workdir" \
            images/ubuntu-24.04-js/boot-test.sh erainfra-boot-test:candidate
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/runner-center-ubuntu-24.04-js
          # A scheduled rebuild gets a dated tag instead of sha-<commit>, so a
          # sha- tag keeps naming the one image its push built.
          tags: |
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=schedule,prefix=weekly-,pattern={{date 'YYYYMMDD'}}
            type=raw,value=edge,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/ubuntu-24.04-js/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/runner-center-ubuntu-24.04-js
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Report immutable manifest digest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/runner-center-ubuntu-24.04-js
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Image Release"
            echo
            echo "\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
