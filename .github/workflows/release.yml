name: EraInfra release

# Tagging `v<version>` publishes the agent archive machines install. Nothing
# else creates releases, and no release is ever overwritten.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 22
          # setup-node v7 auto-enables package-manager caching from package.json;
          # release jobs consume no mutable cache before publishing artifacts.
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds consume no mutable cache from lower-trust refs.
          cache: false

      # EraInfra ships as one product, so the tag has to match the version in
      # the workspace root and in apps/action-runner-agent exactly. Fail here
      # rather than publish an asset whose embedded package.json disagrees with
      # its name.
      - name: Verify the tag matches both package versions
        run: |
          root=$(node -p "require('./package.json').version")
          agent=$(node -p "require('./apps/action-runner-agent/package.json').version")
          controller=$(node -p "require('./apps/controller/package.json').version")
          runtime=$(node -p "require('./apps/runtime/package.json').version")
          if [ "$root" != "$agent" ] || [ "$root" != "$controller" ] || [ "$root" != "$runtime" ]; then
            echo "Version drift: root=$root agent=$agent controller=$controller runtime=$runtime" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/v$root" ]; then
            echo "Tag $GITHUB_REF does not match the product version $root" >&2
            exit 1
          fi
          echo "VERSION=$root" >> "$GITHUB_ENV"

          node --experimental-strip-types --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import {
            AGENT_RELEASE,
            INFRA_AGENT_TARGETS,
            CACHE_SERVICE_TARGETS,
          } from "./packages/backend/convex/agentRelease.ts";

          const version = process.env.GITHUB_REF_NAME?.replace(/^v/, "");
          if (AGENT_RELEASE.repo !== process.env.GITHUB_REPOSITORY) {
            throw new Error(
              `Agent release repository ${AGENT_RELEASE.repo} does not match ${process.env.GITHUB_REPOSITORY}`,
            );
          }
          if (AGENT_RELEASE.version !== version) {
            throw new Error(
              `Agent release pin ${AGENT_RELEASE.version} does not match tag ${process.env.GITHUB_REF_NAME}`,
            );
          }
          if (!/^[a-f0-9]{64}$/.test(AGENT_RELEASE.sha256)) {
            throw new Error("Agent release pin must contain a lowercase SHA-256 checksum");
          }
          // The Node side of the same pin. A release publishes all five binaries, so a pin that
          // covers four of them would leave one platform installing bytes nothing vouches for.
          const pinned = Object.keys(AGENT_RELEASE.infraAgent).sort();
          const expected = [...INFRA_AGENT_TARGETS].sort();
          if (pinned.join(",") !== expected.join(",")) {
            throw new Error(
              `Infra Agent pin covers ${pinned.join(", ") || "no targets"}; expected ${expected.join(", ")}`,
            );
          }
          for (const [target, digest] of Object.entries(AGENT_RELEASE.infraAgent)) {
            if (!/^[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`Infra Agent pin for ${target} is not a lowercase SHA-256 checksum`);
            }
          }
          // The cache service (ADR 0009) is pinned by the same rule: a release publishes its binary,
          // so a pin covering none of its targets would leave the service installing bytes nothing
          // vouches for.
          const cachePinned = Object.keys(AGENT_RELEASE.cacheService).sort();
          const cacheExpected = [...CACHE_SERVICE_TARGETS].sort();
          if (cachePinned.join(",") !== cacheExpected.join(",")) {
            throw new Error(
              `Cache service pin covers ${cachePinned.join(", ") || "no targets"}; expected ${cacheExpected.join(", ")}`,
            );
          }
          for (const [target, digest] of Object.entries(AGENT_RELEASE.cacheService)) {
            if (!/^[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`Cache service pin for ${target} is not a lowercase SHA-256 checksum`);
            }
          }
          appendFileSync(process.env.GITHUB_ENV, `PINNED_SHA256=${AGENT_RELEASE.sha256}\n`);
          NODE

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Test the root Go module
        run: go test ./...
      - name: Vet the root Go module
        run: go vet ./...
      - name: Compile the root Go module for shipped Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o "$RUNNER_TEMP/erainfra-linux-amd64/" ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o "$RUNNER_TEMP/erainfra-linux-arm64/" ./...

      - name: Build the agent release archive
        run: pnpm release:package

      - name: Verify release binary identity
        run: |
          test "$(dist/release/runner-center-runtime-linux-x86_64 version)" = \
            "runner-center-runtime $VERSION"
          dist/release/runner-center-controller-linux-x86_64 version | \
            grep -Fx "runner-center-controller $VERSION ($GITHUB_SHA)"
          dist/release/infra-agent-linux-x86_64 version | \
            grep -Fx "infra-agent $VERSION"
          dist/release/erainfra-cache-service-linux-x86_64 version | \
            grep -Fx "erainfra-cache-service $VERSION"

      - name: Verify the archive is reproducible
        run: |
          pnpm --filter @erainfra/release package-agent --out dist/release-recheck
          cmp "dist/release/erainfra-agent-$VERSION.tar.gz" \
            "dist/release-recheck/erainfra-agent-$VERSION.tar.gz"
          actual=$(cut -d ' ' -f 1 < "dist/release/erainfra-agent-$VERSION.tar.gz.sha256")
          if [ "$actual" != "$PINNED_SHA256" ]; then
            echo "Archive checksum $actual does not match deployment pin $PINNED_SHA256" >&2
            exit 1
          fi

      # A Node installs whichever of these five matches its platform, and the installer refuses on a
      # checksum mismatch — so the checksum has to describe a build anyone can reproduce, not one
      # only this runner could have produced. Same property, same method, as the archive above.
      # Runs after the archive check because rebuilding also rewrites the runtime binaries the
      # archive embeds, and this must not change what that check proves.
      - name: Verify the Infra Agent binaries are reproducible
        run: |
          pnpm --filter @erainfra/release build-go-assets --out dist/release-recheck
          for asset in \
            infra-agent-linux-x86_64 \
            infra-agent-linux-arm64 \
            infra-agent-darwin-x86_64 \
            infra-agent-darwin-arm64 \
            infra-agent-windows-x86_64.exe \
            erainfra-cache-service-linux-x86_64
          do
            cmp "dist/release/$asset" "dist/release-recheck/$asset"
            echo "identical  $asset  $(cut -d ' ' -f 1 < "dist/release/$asset.sha256")"
          done

      # `cmp` proves a build is reproducible. It says nothing about which platform the bytes target,
      # so a transposed GOOS or GOARCH would publish a perfectly reproducible Linux binary under a
      # macOS name and the first thing to notice would be `Exec format error` on a customer's Node.
      #
      # Read the toolchain's own record rather than sniffing magic bytes: GOOS distinguishes darwin
      # from linux from windows exactly, where an ELF header only says "not Mach-O, not PE". The two
      # cannot disagree — the build info lives in the same file as the header — and a file that is
      # not a Go executable at all fails `go version -m` outright, which fails this step.
      - name: Every Go asset targets the platform its name claims
        run: |
          for asset in dist/release/*; do
            case "$asset" in *.sha256 | *.tar.gz) continue ;; esac
            name=${asset##*/}
            stem=${name%.exe}
            cpu=${stem##*-}
            os=${stem%-*}
            os=${os##*-}
            case "$cpu" in
              x86_64) arch=amd64 ;;
              arm64) arch=arm64 ;;
              *) echo "$name: asset name does not end in a CPU this release publishes" >&2; exit 1 ;;
            esac
            case "$os" in
              linux | darwin | windows) ;;
              *) echo "$name: asset name does not carry an OS this release publishes" >&2; exit 1 ;;
            esac
            built=$(go version -m "$asset" |
              awk '$1 == "build" && ($2 ~ /^GOOS=/ || $2 ~ /^GOARCH=/) { print $2 }' | sort | tr '\n' ' ')
            declared="GOARCH=$arch GOOS=$os "
            if [ "$built" != "$declared" ]; then
              echo "$name is named for $declared but the toolchain recorded $built" >&2
              exit 1
            fi
            printf 'platform  %s  %s\n' "$name" "$declared"
          done

      # Same rule as the archive: bytes that do not match what this deployment pins are not
      # published, because the installer will refuse them and a Node would have no way to onboard.
      - name: Verify the Infra Agent and cache-service binaries match the deployment pin
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import {
            AGENT_RELEASE,
            INFRA_AGENT_TARGETS,
            infraAgentAssetName,
            CACHE_SERVICE_TARGETS,
            cacheServiceAssetName,
          } from "./packages/backend/convex/agentRelease.ts";

          for (const target of INFRA_AGENT_TARGETS) {
            const asset = infraAgentAssetName(target);
            const built = readFileSync(`dist/release/${asset}.sha256`, "utf8").split(" ")[0];
            const pinned = AGENT_RELEASE.infraAgent[target];
            if (built !== pinned) {
              throw new Error(`${asset} is ${built}, but this deployment pins ${pinned}`);
            }
            console.log(`${built}  ${asset}  matches the deployment pin`);
          }
          for (const target of CACHE_SERVICE_TARGETS) {
            const asset = cacheServiceAssetName(target);
            const built = readFileSync(`dist/release/${asset}.sha256`, "utf8").split(" ")[0];
            const pinned = AGENT_RELEASE.cacheService[target];
            if (built !== pinned) {
              throw new Error(`${asset} is ${built}, but this deployment pins ${pinned}`);
            }
            console.log(`${built}  ${asset}  matches the deployment pin`);
          }
          NODE

      # This binary runs as root on customer Nodes. Assert on the shipped bytes rather than on
      # go.mod: go.mod is the whole platform's now and says nothing about what this binary linked,
      # so a helper that innocently imported an apps/controller package would widen the dependency
      # surface with a perfectly green build. ci.yml makes the same assertion on every push; this
      # one makes it about the artifact being published.
      - name: The published Infra Agent ships exactly one dependency
        run: |
          deps=$(go version -m dist/release/infra-agent-linux-x86_64 | awk '$1 == "dep" { print $2, $3 }')
          echo "$deps"
          test "$deps" = "github.com/gorilla/websocket v1.5.3"

      # Exactly the command a machine runs during install.
      - name: Verify the agent lockfile installs cleanly
        working-directory: apps/action-runner-agent
        run: npm ci --omit=dev --no-audit --no-fund

      # Attest everything this release publishes, by glob rather than by list. A hand-maintained list
      # is how an asset ends up published but unattested: the previous one named the twelve binaries
      # and silently omitted the eleven `.sha256` sidecars that `gh release create` uploads beside
      # them. `dist/release` holds exactly the built set — build-go-assets wipes and refills it with
      # 11 binaries and their sidecars, then package-agent adds the archive and its sidecar — so a
      # future asset is covered the day it is built rather than the day someone remembers.
      #
      # The three `deploy/` files are listed because they are verbatim repo files rather than build
      # output, and a customer who downloads `provision-firecracker-host.sh` from the release page
      # and runs it as root has the same need for provenance as one who downloads a binary.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*
            deploy/systemd/runner-center-runtime.service
            deploy/systemd/runner-center-controller@.service
            deploy/provision-firecracker-host.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease+=(--prerelease) ;;
          esac
          sha256=$(cut -d ' ' -f 1 < "dist/release/erainfra-agent-$VERSION.tar.gz.sha256")
          # Markdown code spans are intentionally literal in these format strings.
          # shellcheck disable=SC2016
          {
            printf 'Agent archive for EraInfra %s.\n\n' "$VERSION"
            printf 'SHA-256 of `erainfra-agent-%s.tar.gz`:\n\n' "$VERSION"
            printf '    %s\n\n' "$sha256"
            printf 'SHA-256 of the Infra Agent binaries a Node installs:\n\n'
            for sidecar in dist/release/infra-agent-*.sha256; do
              printf '    %s\n' "$(cat "$sidecar")"
            done
            printf '\n'
            printf 'The release commit already pins these bytes in `AGENT_RELEASE`.\n'
            printf 'Roll the fleet forward with `pnpm run deploy:control-plane` after this workflow succeeds.\n'
            printf 'After that deploy, a single machine can be moved with `rc update`.\n'
          } > release-notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            "dist/release/erainfra-agent-$VERSION.tar.gz" \
            "dist/release/erainfra-agent-$VERSION.tar.gz.sha256" \
            dist/release/runner-center-controller-* \
            dist/release/runner-center-runtime-* \
            dist/release/infra-agent-* \
            dist/release/erainfra-cache-service-* \
            deploy/systemd/runner-center-runtime.service \
            deploy/systemd/runner-center-controller@.service \
            deploy/provision-firecracker-host.sh

      # rc.5 published seventeen assets while this workflow built, cross-compiled and tested five
      # Infra Agent binaries it never uploaded — the gap ADR 0004 named. Nothing asserted the count,
      # so nothing noticed for a whole release. Compare what was built against what was published
      # rather than against a constant nobody would maintain: a glob above that matches nothing then
      # fails here instead of shipping a quietly smaller release.
      - name: Every built asset reached the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find dist/release -type f | wc -l | tr -d ' ')
          published=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
          echo "built $built in dist/release; published $published (expected built + 3 repo files)"
          test "$published" -eq "$((built + 3))"
