name: EraInfra release

# Tagging `v<version>` publishes the agent archive machines install. Nothing
# else creates releases, and no release is ever overwritten.
on:
  push:
    tags: ["v*"]
  # Build-only dispatch supplies all five mesh digests before a release commit/tag.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # erainfra-mesh (ADR 0016) is Rust, and two of its five targets need their own OS: Apple's SDK
  # cannot be shipped to a Linux runner, and MSVC only runs on Windows. The Linux musl targets
  # cross-compile with cargo-zigbuild (see packages/release/src/mesh-assets.ts for why). Each runner
  # builds twice from empty target directories and compares, the property the Go assets are held
  # to below, then hands its assets to the release job, which checks, attests and publishes them
  # with everything else. Nothing here is cached, for the same reason the release job caches nothing.
  mesh:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            targets: --target linux-x86_64 --target linux-arm64
          - runner: macos-latest
            targets: --target darwin-arm64 --target darwin-x86_64
          - runner: windows-latest
            targets: --target windows-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os == 'Linux'
        with:
          version: 0.17.1
          use-cache: false
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        env:
          ZIGBUILD_VERSION: 0.24.1
          ZIGBUILD_SHA256: f09b180a517af0e4dd4bffc921bb88e5ab705452a9dd948c61e489b3020c68c2
        run: |
          # GitHub release downloads can fail for an hour at a time (504s on 2026-11-08). After
          # the retries, build the same pinned version from crates.io instead.
          mkdir -p "$RUNNER_TEMP/zigbuild"
          if curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 15 --retry-all-errors --connect-timeout 30 -o "$RUNNER_TEMP/zigbuild.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"; then
            echo "$ZIGBUILD_SHA256  $RUNNER_TEMP/zigbuild.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/zigbuild.tar.xz" -C "$RUNNER_TEMP/zigbuild" --strip-components=1
          else
            echo "::warning::cargo-zigbuild $ZIGBUILD_VERSION download failed; building it from crates.io"
            cargo install --locked --version "$ZIGBUILD_VERSION" --root "$RUNNER_TEMP/zigbuild-src" cargo-zigbuild
            cp "$RUNNER_TEMP/zigbuild-src/bin/cargo-zigbuild" "$RUNNER_TEMP/zigbuild/"
          fi
          echo "$RUNNER_TEMP/zigbuild" >> "$GITHUB_PATH"
      - name: Install the pinned Rust toolchain
        working-directory: apps/mesh
        run: rustup toolchain install
      - name: Build erainfra-mesh
        run: |
          # TARGETS is word-split on purpose: it is a list of `--target <name>` flags.
          # shellcheck disable=SC2086
          node --experimental-strip-types packages/release/bin/build-mesh-assets.ts $TARGETS
      - name: Verify erainfra-mesh is reproducible
        run: |
          # shellcheck disable=SC2086
          node --experimental-strip-types packages/release/bin/build-mesh-assets.ts $TARGETS \
            --out dist/mesh-recheck
          for sidecar in dist/release/erainfra-mesh-*.sha256; do
            asset=${sidecar%.sha256}
            cmp "$asset" "dist/mesh-recheck/${asset##*/}"
            echo "identical  $(cat "$sidecar")"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesh-${{ runner.os }}
          path: dist/release/erainfra-mesh-*
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mesh
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance attestation
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 22
          # setup-node v7 auto-enables package-manager caching from package.json;
          # release jobs consume no mutable cache before publishing artifacts.
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds consume no mutable cache from lower-trust refs.
          cache: false

      # EraInfra ships as one product, so the tag has to match the version in
      # the workspace root and in apps/action-runner-agent exactly. Fail here
      # rather than publish an asset whose embedded package.json disagrees with
      # its name.
      - name: Verify the tag matches both package versions
        run: |
          root=$(node -p "require('./package.json').version")
          agent=$(node -p "require('./apps/action-runner-agent/package.json').version")
          controller=$(node -p "require('./apps/controller/package.json').version")
          runtime=$(node -p "require('./apps/runtime/package.json').version")
          mesh=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/mesh/Cargo.toml | head -n 1)
          if [ "$root" != "$agent" ] || [ "$root" != "$controller" ] || [ "$root" != "$runtime" ] ||
            [ "$root" != "$mesh" ]; then
            echo "Version drift: root=$root agent=$agent controller=$controller runtime=$runtime mesh=$mesh" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/v$root" ]; then
            echo "Tag $GITHUB_REF does not match the product version $root" >&2
            exit 1
          fi
          echo "VERSION=$root" >> "$GITHUB_ENV"

          node --experimental-strip-types --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import {
            AGENT_RELEASE,
            INFRA_AGENT_TARGETS,
            CACHE_SERVICE_TARGETS,
            CONTROLLER_TARGETS,
            MESH_TARGETS,
          } from "./packages/backend/convex/agentRelease.ts";

          const version = process.env.GITHUB_REF_NAME?.replace(/^v/, "");
          if (AGENT_RELEASE.repo !== process.env.GITHUB_REPOSITORY) {
            throw new Error(
              `Agent release repository ${AGENT_RELEASE.repo} does not match ${process.env.GITHUB_REPOSITORY}`,
            );
          }
          if (AGENT_RELEASE.version !== version) {
            throw new Error(
              `Agent release pin ${AGENT_RELEASE.version} does not match tag ${process.env.GITHUB_REF_NAME}`,
            );
          }
          if (!/^[a-f0-9]{64}$/.test(AGENT_RELEASE.sha256)) {
            throw new Error("Agent release pin must contain a lowercase SHA-256 checksum");
          }
          // The Node side of the same pin. A release publishes all five binaries, so a pin that
          // covers four of them would leave one platform installing bytes nothing vouches for.
          const pinned = Object.keys(AGENT_RELEASE.infraAgent).sort();
          const expected = [...INFRA_AGENT_TARGETS].sort();
          if (pinned.join(",") !== expected.join(",")) {
            throw new Error(
              `Infra Agent pin covers ${pinned.join(", ") || "no targets"}; expected ${expected.join(", ")}`,
            );
          }
          for (const [target, digest] of Object.entries(AGENT_RELEASE.infraAgent)) {
            if (!/^[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`Infra Agent pin for ${target} is not a lowercase SHA-256 checksum`);
            }
          }
          // The cache service (ADR 0009) is pinned by the same rule: a release publishes its binary,
          // so a pin covering none of its targets would leave the service installing bytes nothing
          // vouches for.
          const cachePinned = Object.keys(AGENT_RELEASE.cacheService).sort();
          const cacheExpected = [...CACHE_SERVICE_TARGETS].sort();
          if (cachePinned.join(",") !== cacheExpected.join(",")) {
            throw new Error(
              `Cache service pin covers ${cachePinned.join(", ") || "no targets"}; expected ${cacheExpected.join(", ")}`,
            );
          }
          for (const [target, digest] of Object.entries(AGENT_RELEASE.cacheService)) {
            if (!/^[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`Cache service pin for ${target} is not a lowercase SHA-256 checksum`);
            }
          }
          // The controller's Linux binaries, which `/install --role controller` verifies, by the
          // same rule.
          const controllerPinned = Object.keys(AGENT_RELEASE.controller).sort();
          const controllerExpected = [...CONTROLLER_TARGETS].sort();
          if (controllerPinned.join(",") !== controllerExpected.join(",")) {
            throw new Error(
              `Controller pin covers ${controllerPinned.join(", ") || "no targets"}; expected ${controllerExpected.join(", ")}`,
            );
          }
          for (const [target, digest] of Object.entries(AGENT_RELEASE.controller)) {
            if (!/^[a-f0-9]{64}$/.test(digest)) {
              throw new Error(`Controller pin for ${target} is not a lowercase SHA-256 checksum`);
            }
          }
          const meshPinned = Object.keys(AGENT_RELEASE.mesh).sort();
          if (meshPinned.join(",") !== [...MESH_TARGETS].sort().join(",")) {
            throw new Error("Mesh pin must cover all five published targets before tagging; generate it from verified build sidecars");
          }
          for (const [target,digest] of Object.entries(AGENT_RELEASE.mesh)) {
            if (!/^[a-f0-9]{64}$/.test(digest)) throw new Error(`Invalid mesh pin for ${target}`);
          }
          appendFileSync(process.env.GITHUB_ENV, `PINNED_SHA256=${AGENT_RELEASE.sha256}\n`);
          NODE

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Test the root Go module
        run: go test ./...
      - name: Vet the root Go module
        run: go vet ./...
      - name: Compile the root Go module for shipped Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o "$RUNNER_TEMP/erainfra-linux-amd64/" ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o "$RUNNER_TEMP/erainfra-linux-arm64/" ./...

      - name: Build the agent release archive
        run: pnpm release:package

      - name: Verify release binary identity
        run: |
          test "$(dist/release/runner-center-runtime-linux-x86_64 version)" = \
            "runner-center-runtime $VERSION"
          dist/release/runner-center-controller-linux-x86_64 version | \
            grep -Fx "runner-center-controller $VERSION"
          dist/release/infra-agent-linux-x86_64 version | \
            grep -Fx "infra-agent $VERSION"
          dist/release/erainfra-cache-service-linux-x86_64 version | \
            grep -Fx "erainfra-cache-service $VERSION"

      - name: Verify the archive is reproducible
        run: |
          pnpm --filter @erainfra/release package-agent --out dist/release-recheck
          cmp "dist/release/erainfra-agent-$VERSION.tar.gz" \
            "dist/release-recheck/erainfra-agent-$VERSION.tar.gz"
          actual=$(cut -d ' ' -f 1 < "dist/release/erainfra-agent-$VERSION.tar.gz.sha256")
          if [ "$actual" != "$PINNED_SHA256" ]; then
            echo "Archive checksum $actual does not match deployment pin $PINNED_SHA256" >&2
            exit 1
          fi

      # A Node installs whichever of these five matches its platform, and the installer refuses on a
      # checksum mismatch — so the checksum has to describe a build anyone can reproduce, not one
      # only this runner could have produced. Same property, same method, as the archive above.
      # Runs after the archive check because rebuilding also rewrites the runtime binaries the
      # archive embeds, and this must not change what that check proves.
      - name: Verify the Infra Agent binaries are reproducible
        run: |
          pnpm --filter @erainfra/release build-go-assets --out dist/release-recheck
          for asset in \
            infra-agent-linux-x86_64 \
            infra-agent-linux-arm64 \
            infra-agent-darwin-x86_64 \
            infra-agent-darwin-arm64 \
            infra-agent-windows-x86_64.exe \
            erainfra-cache-service-linux-x86_64 \
            runner-center-controller-linux-x86_64 \
            runner-center-controller-linux-arm64
          do
            cmp "dist/release/$asset" "dist/release-recheck/$asset"
            echo "identical  $asset  $(cut -d ' ' -f 1 < "dist/release/$asset.sha256")"
          done

      # `cmp` proves a build is reproducible. It says nothing about which platform the bytes target,
      # so a transposed GOOS or GOARCH would publish a perfectly reproducible Linux binary under a
      # macOS name and the first thing to notice would be `Exec format error` on a customer's Node.
      #
      # Read the toolchain's own record rather than sniffing magic bytes: GOOS distinguishes darwin
      # from linux from windows exactly, where an ELF header only says "not Mach-O, not PE". The two
      # cannot disagree — the build info lives in the same file as the header — and a file that is
      # not a Go executable at all fails `go version -m` outright, which fails this step.
      - name: Every Go asset targets the platform its name claims
        run: |
          for asset in dist/release/*; do
            # erainfra-mesh is Rust and has no Go build info; the step after next checks it.
            case "$asset" in *.sha256 | *.tar.gz | */erainfra-mesh-*) continue ;; esac
            name=${asset##*/}
            stem=${name%.exe}
            cpu=${stem##*-}
            os=${stem%-*}
            os=${os##*-}
            case "$cpu" in
              x86_64) arch=amd64 ;;
              arm64) arch=arm64 ;;
              *) echo "$name: asset name does not end in a CPU this release publishes" >&2; exit 1 ;;
            esac
            case "$os" in
              linux | darwin | windows) ;;
              *) echo "$name: asset name does not carry an OS this release publishes" >&2; exit 1 ;;
            esac
            built=$(go version -m "$asset" |
              awk '$1 == "build" && ($2 ~ /^GOOS=/ || $2 ~ /^GOARCH=/) { print $2 }' | sort | tr '\n' ' ')
            declared="GOARCH=$arch GOOS=$os "
            if [ "$built" != "$declared" ]; then
              echo "$name is named for $declared but the toolchain recorded $built" >&2
              exit 1
            fi
            printf 'platform  %s  %s\n' "$name" "$declared"
          done

      # The mesh job's five binaries join the Go assets here, after every step that rebuilds or
      # wipes dist/release, so the attestation and the published-count check below cover them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mesh-*
          path: dist/release
          merge-multiple: true

      # The same two questions the Go assets answer above, asked of a Rust binary: did the bytes
      # survive the hop between jobs, and does each file target the platform its name claims. A
      # Rust binary carries no `go version -m` record, so `file` reads the ELF, Mach-O or PE
      # header; Linux must also be static, because a musl binary that links anything dynamically
      # would fail on a distribution without that library.
      - name: Every erainfra-mesh asset is intact and targets the platform its name claims
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { AGENT_RELEASE, MESH_TARGETS, meshAssetName } from "./packages/backend/convex/agentRelease.ts";
          import { existsSync, readFileSync } from "node:fs";
          for (const target of MESH_TARGETS) {
            const asset = `dist/release/${meshAssetName(target)}`;
            if (!existsSync(asset) || !existsSync(`${asset}.sha256`)) {
              throw new Error(`${asset} or its sidecar is missing`);
            }
            const built = readFileSync(`${asset}.sha256`, "utf8").split(" ")[0];
            if (built !== AGENT_RELEASE.mesh[target]) throw new Error(`${asset} does not match the deployment mesh pin`);
          }
          NODE
          (cd dist/release && sha256sum -c erainfra-mesh-*.sha256)
          expect() {
            description=$(file -b "dist/release/$1")
            echo "$1: $description"
            echo "$description" | grep -Eq "$2" || {
              echo "$1 is not $2" >&2
              exit 1
            }
          }
          expect erainfra-mesh-linux-x86_64 '^ELF 64-bit .*x86-64.*(statically|static-pie) linked'
          expect erainfra-mesh-linux-arm64 '^ELF 64-bit .*ARM aarch64.*(statically|static-pie) linked'
          expect erainfra-mesh-darwin-x86_64 '^Mach-O 64-bit .*x86_64'
          expect erainfra-mesh-darwin-arm64 '^Mach-O 64-bit .*arm64'
          expect erainfra-mesh-windows-x86_64.exe '^PE32\+ executable .*x86-64'
          chmod +x dist/release/erainfra-mesh-linux-x86_64
          dist/release/erainfra-mesh-linux-x86_64 version | grep -Fx "erainfra-mesh $VERSION"

      # Same rule as the archive: bytes that do not match what this deployment pins are not
      # published, because the installer will refuse them and a Node would have no way to onboard.
      - name: Verify the Infra Agent, cache-service and controller binaries match the deployment pin
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import {
            AGENT_RELEASE,
            INFRA_AGENT_TARGETS,
            infraAgentAssetName,
            CACHE_SERVICE_TARGETS,
            cacheServiceAssetName,
            CONTROLLER_TARGETS,
            controllerAssetName,
          } from "./packages/backend/convex/agentRelease.ts";

          for (const target of INFRA_AGENT_TARGETS) {
            const asset = infraAgentAssetName(target);
            const built = readFileSync(`dist/release/${asset}.sha256`, "utf8").split(" ")[0];
            const pinned = AGENT_RELEASE.infraAgent[target];
            if (built !== pinned) {
              throw new Error(`${asset} is ${built}, but this deployment pins ${pinned}`);
            }
            console.log(`${built}  ${asset}  matches the deployment pin`);
          }
          for (const target of CACHE_SERVICE_TARGETS) {
            const asset = cacheServiceAssetName(target);
            const built = readFileSync(`dist/release/${asset}.sha256`, "utf8").split(" ")[0];
            const pinned = AGENT_RELEASE.cacheService[target];
            if (built !== pinned) {
              throw new Error(`${asset} is ${built}, but this deployment pins ${pinned}`);
            }
            console.log(`${built}  ${asset}  matches the deployment pin`);
          }
          for (const target of CONTROLLER_TARGETS) {
            const asset = controllerAssetName(target);
            const built = readFileSync(`dist/release/${asset}.sha256`, "utf8").split(" ")[0];
            const pinned = AGENT_RELEASE.controller[target];
            if (built !== pinned) {
              throw new Error(`${asset} is ${built}, but this deployment pins ${pinned}`);
            }
            console.log(`${built}  ${asset}  matches the deployment pin`);
          }
          NODE

      # ci.yml scans the source on every push; this scans the bytes being published, so an advisory
      # disclosed between that push and this tag still stops the release. Binary mode reads the
      # module list and the function table each Go executable carries (`-s -w` keeps both) and
      # fails when a vulnerable function was linked in, the standard library included.
      - name: No published Go binary links a known-vulnerable function
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for asset in dist/release/*; do
            # erainfra-mesh is Rust: govulncheck cannot read it, and cargo deny checks its
            # dependencies against the RustSec database in CI's mesh job.
            case "$asset" in *.sha256 | *.tar.gz | */erainfra-mesh-*) continue ;; esac
            echo "govulncheck ${asset##*/}"
            "$RUNNER_TEMP/bin/govulncheck" -mode binary "$asset"
          done

      # Exactly the command a machine runs during install.
      - name: Verify the agent lockfile installs cleanly
        working-directory: apps/action-runner-agent
        run: npm ci --omit=dev --no-audit --no-fund

      # Attest everything this release publishes, by glob rather than by list. A hand-maintained list
      # is how an asset ends up published but unattested: the previous one named the twelve binaries
      # and silently omitted the eleven `.sha256` sidecars that `gh release create` uploads beside
      # them. `dist/release` holds exactly the built set — build-go-assets wipes and refills it with
      # 17 binaries and their sidecars, then package-agent adds the archive and its sidecar — so a
      # future asset is covered the day it is built rather than the day someone remembers. The five
      # erainfra-mesh binaries and their sidecars arrive from the mesh job before this step, so the
      # glob covers them too.
      #
      # The three `deploy/` files are listed because they are verbatim repo files rather than build
      # output, and a customer who downloads `provision-firecracker-host.sh` from the release page
      # and runs it as root has the same need for provenance as one who downloads a binary.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*
            deploy/systemd/runner-center-runtime.service
            deploy/systemd/runner-center-controller@.service
            deploy/provision-firecracker-host.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease+=(--prerelease) ;;
          esac
          sha256=$(cut -d ' ' -f 1 < "dist/release/erainfra-agent-$VERSION.tar.gz.sha256")
          # Markdown code spans are intentionally literal in these format strings.
          # shellcheck disable=SC2016
          {
            printf 'Agent archive for EraInfra %s.\n\n' "$VERSION"
            printf 'SHA-256 of `erainfra-agent-%s.tar.gz`:\n\n' "$VERSION"
            printf '    %s\n\n' "$sha256"
            printf 'SHA-256 of the Infra Agent binaries a Node installs:\n\n'
            for sidecar in dist/release/infra-agent-*.sha256; do
              printf '    %s\n' "$(cat "$sidecar")"
            done
            printf '\n'
            printf 'SHA-256 of the erainfra-mesh binaries (ADR 0016; opt-in Node sidecar):\n\n'
            for sidecar in dist/release/erainfra-mesh-*.sha256; do
              printf '    %s\n' "$(cat "$sidecar")"
            done
            printf '\n'
            printf 'The release commit already pins these bytes in `AGENT_RELEASE`.\n'
            printf 'Roll the fleet forward with `pnpm run deploy:control-plane` after this workflow succeeds.\n'
            printf 'After that deploy, a single machine can be moved with `rc update`.\n'
          } > release-notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            "dist/release/erainfra-agent-$VERSION.tar.gz" \
            "dist/release/erainfra-agent-$VERSION.tar.gz.sha256" \
            dist/release/runner-center-controller-* \
            dist/release/runner-center-runtime-* \
            dist/release/infra-agent-* \
            dist/release/erainfra-cache-service-* \
            dist/release/erainfra-linux-* \
            dist/release/erainfra-darwin-* \
            dist/release/erainfra-windows-* \
            dist/release/erainfra-mesh-* \
            deploy/systemd/runner-center-runtime.service \
            deploy/systemd/runner-center-controller@.service \
            deploy/provision-firecracker-host.sh

      # rc.5 published seventeen assets while this workflow built, cross-compiled and tested five
      # Infra Agent binaries it never uploaded — the gap ADR 0004 named. Nothing asserted the count,
      # so nothing noticed for a whole release. Compare what was built against what was published
      # rather than against a constant nobody would maintain: a glob above that matches nothing then
      # fails here instead of shipping a quietly smaller release.
      - name: Every built asset reached the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find dist/release -type f | wc -l | tr -d ' ')
          published=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
          echo "built $built in dist/release; published $published (expected built + 3 repo files)"
          test "$published" -eq "$((built + 3))"
