name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party and first-party actions alike are pinned by commit SHA: a
      # tag can be moved, a commit cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Runner machines install the agent with npm, not pnpm, so its lockfile
      # has to stay in sync with its package.json. This replaces the pnpm
      # node_modules in apps/agent, so keep it last.
      - name: Verify the agent lockfile matches its manifest
        working-directory: apps/agent
        run: npm ci --omit=dev --no-audit --no-fund
