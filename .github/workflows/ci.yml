name: EraInfra CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party and first-party actions alike are pinned by commit SHA: a
      # tag can be moved, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the frozen-identifier gate diffs against the base commit
      # A repository path is invisible to every machine in the field. A Docker volume name, a
      # systemd unit, an env-var name, a published package name and a download URL are not — see
      # CONTEXT.md naming rule 4. The worst of them is the portless-data volume: it holds
      # portless.db, the Hub's accounts, Apps, routes and tokens. hub.sh is idempotent by design
      # and customers re-run it, so a renamed volume silently comes up empty, and CI cannot catch
      # that any other way because CI never runs hub.sh.
      #
      # The check is set-difference, not "did a frozen word appear in the diff at all". Renaming a
      # path that a frozen variable's VALUE points at is legal and routine, so a raw match fires on
      # legitimate work; what is never legal is a frozen identifier leaving the tree. Comparing the
      # removed set against the added set also survives git giving up on rename detection, which
      # turns a moved file into delete-plus-add and floods any line-based version of this.
      - name: No frozen runtime identifier is renamed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Frozen identifiers come in two shapes and they need different boundaries. Conflating
          # them is how the first version of this gate let a rename through: `grep -oE` extracted
          # `portless-data` out of `portless-data-v2`, so the ADDED side of a rename vouched for the
          # name the REMOVED side had just dropped.
          #
          # EXACT — the identifier is a whole token, and a superstring is a different thing. A
          # container called `portless-data-v2` is not the volume `portless-data`; an env var
          # `PORTLESS_HUB2` is not `PORTLESS_HUB`; `~/.portlessrc` is not `~/.portless`.
          EXACT='portless-(data|registry|hub|env)|portless\.db|\.portless|PORTLESS_[A-Z0-9_]+'
          # PREFIX — the identifier legitimately continues, measured against the tree: `portless-agent`
          # is the stem of portless-agent-linux-arm64 and portless-agent.service, `/etc/portless` is a
          # directory holding agent.env, and `portless-tunnel` names portless-tunnel.service.
          PREFIX='portless-agent|/etc/portless|portless-tunnel'
          # What may extend an EXACT identifier. A `.` counts only when something follows it, which is
          # the distinction between prose and a name: "...the portless-data volume." ends a sentence,
          # while portless-data.v2 is a DIFFERENT volume and must not vouch for portless-data. `/` is
          # excluded outright, since it starts a new path segment rather than extending a name.
          EXT='([A-Za-z0-9_-]|\.[A-Za-z0-9_-])'
          # The diff is taken once, as its own command, so `set -e` still catches git failing —
          # a silently empty diff here would fail this check open. The greps below are then
          # allowed to match nothing, which is the normal case for almost every pull request.
          #
          # This file is excluded from every scan: the patterns above name every frozen identifier
          # literally, so without the exclusion an edit here would add all of them to the
          # "still present" side and mask a genuine removal somewhere else in the same PR.
          git diff --unified=0 -M20% -l0 "$BASE" -- . ':(exclude).github/workflows/ci.yml' > /tmp/pr.diff
          # Pull frozen identifiers out of whatever is on stdin. EXACT names are taken with their
          # surrounding token and then required to BE the whole token; PREFIX names are taken as-is.
          extract() {
            cat > /tmp/extract.in
            grep -oE "$EXT*($EXACT)$EXT*" /tmp/extract.in | grep -xE "$EXACT" || true
            # Two stages for PREFIX: the first enforces a LEFT boundary, so `myportless-agent` cannot
            # vouch for `portless-agent`; the second recovers just the name from that match. A left
            # boundary cannot be a plain prefix test, because these appear mid-path
            # (../../deploy/infra/bin/portless-agent-darwin-arm64) as well as at the start.
            grep -oE "(^|[^A-Za-z0-9_-])($PREFIX)" /tmp/extract.in | grep -oE "$PREFIX" || true
          }
          side() {
            grep "^[$1]" /tmp/pr.diff | grep -vE '^(\+\+\+|---)' | extract | sort -u
          }
          side - > /tmp/frozen-removed
          side + > /tmp/frozen-added
          # A frozen identifier can leave THIS DIFF while staying in the tree, and that is a refactor
          # rather than a rename: when the only site that wrote it moves to a file that already
          # contained it, the diff shows a removal with no matching addition. #72 hit exactly this —
          # `deploy/infra/agent.sh` stopped writing PORTLESS_HUB because `/install --role node` writes
          # it now, and the name was still in five other files including apps/infra-agent/main.go,
          # where it is the --hub flag default.
          #
          # So the diff decides what to LOOK at and the tree decides whether it is gone, which is what
          # makes the message below true; it has always claimed "left the tree" while only ever
          # measuring the diff. Absence is still the failure: this narrows a false positive rather than
          # adding an escape hatch, and both sides extract identically so neither can vouch more
          # loosely than the other.
          comm -23 /tmp/frozen-removed /tmp/frozen-added > /tmp/frozen-diff-gone
          # Only lines that mention the stem can carry a frozen identifier — every name in both
          # patterns above contains "portless" — so this scans those rather than the whole tree.
          git grep -hIi --no-color -e portless -- . ':(exclude).github/workflows/ci.yml' \
            | extract | sort -u > /tmp/frozen-tree
          gone=$(comm -23 /tmp/frozen-diff-gone /tmp/frozen-tree)
          moved=$(comm -12 /tmp/frozen-diff-gone /tmp/frozen-tree)
          if [ -n "$moved" ]; then
            echo "Left this diff but still in the tree, so moved rather than renamed:"
            echo "$moved"
          fi
          if [ -n "$gone" ]; then
            echo "These frozen runtime identifiers left the tree:" >&2
            echo "$gone" >&2
            echo >&2
            echo "Anything on this list is migrated by its own staged rollout (ADR 0004" >&2
            echo "consequences, CONTEXT.md rule 4), not by a rename. If a customer's box" >&2
            echo "already holds the name, this PR is the wrong place to change it." >&2
            exit 1
          fi
          echo "Frozen identifiers touched by this diff, all still present:"
          comm -12 /tmp/frozen-removed /tmp/frozen-added
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The Node suite pins server.ts's four import.meta.dirname defaults as they resolve from a
      # checkout. hub.sh no longer mounts a checkout — it mounts dist/hub — and all four of those
      # lookups fail SOFT: a missing file is a 404 whose body a shell dutifully executes as a
      # no-op, so `curl <hub>/agent.sh | sh` silently does nothing and reports success. A bundle
      # that boots proves nothing; the served bodies do. Runs after `pnpm build` because it needs
      # apps/hub-web/dist, and before nothing that reads the workspace's node_modules, because
      # `pnpm deploy` leaves its dependency-status check wanting a re-install.
      - name: The assembled Hub bundle serves every onboarding route
        run: |
          sh deploy/infra/build-hub-bundle.sh
          sh deploy/infra/bundle.test.sh
      # The five installer scripts are curl'd and piped to sh on a customer's machine, so each
      # carries its own copy of dual_env rather than sourcing one — five chances to write
      # `${NEW:-${OLD}}` in a way that looks right and silently reclassifies "set to empty" as
      # "unset". `pnpm test` cannot reach them: deploy/ is not a workspace package. This runs the
      # real functions out of the real files, and pins the frozen identifiers they still write.
      - name: The installers read both names and rename nothing frozen
        run: sh deploy/infra/rename.test.sh
      # `pnpm test` runs the PowerShell suite only when pwsh is on PATH, so on a contributor's
      # machine it degrades to a skip. Here it must not: an installer that does not parse is the
      # failure mode with no other signal, and the runner image ships PowerShell.
      #
      # `node`, not `pnpm run`: the Hub-bundle step above leaves pnpm's dependency status wanting a
      # re-install, so pnpm prefixes its own summary to stdout and that summary lands in the file
      # being parsed. The script imports nothing outside this repository, so it needs no
      # node_modules. The first line is checked because a truncated render still parses as nothing.
      - name: The rendered Windows installer parses
        working-directory: packages/backend
        run: |
          node --experimental-strip-types scripts/print-install-script.ts win \
            https://example.convex.site > "$RUNNER_TEMP/install.ps1"
          head -n 1 "$RUNNER_TEMP/install.ps1" | grep -qx '#Requires -Version 5.1'
          pwsh -NoProfile -Command '$null = [ScriptBlock]::Create((Get-Content -Raw $env:RUNNER_TEMP/install.ps1))'
      # The environment conformance workflow only runs on a pull request that
      # touches the provisioners, the images or readiness.ts, so its differ is
      # untested on every other PR. This runs its self-test here instead: it
      # shellchecks the three scripts, proves the fingerprint is byte-identical
      # across two runs on this machine, and proves the diff goes RED -- one
      # case per failure mode, including deleting an entry from the real
      # allowlist and requiring the difference it covered to surface. A
      # conformance job nobody has watched fail is indistinguishable from a
      # vacuous one, which is the same lesson rename.test.sh above learned the
      # expensive way.
      - name: The environment conformance differ can go red
        run: sh .github/conformance/conformance.test.sh
      # cache-env-probe.yml is dispatched by hand against a live Profile, so no
      # pull request ever executes it and a probe that had quietly stopped
      # measuring anything would look exactly like one nobody had dispatched
      # yet. This drives its capture endpoint with a real HTTP client, checks
      # each answer against the shape ADR 0007's capture measured, and proves
      # the verdict can report the NEGATIVE outcome -- the one the probe exists
      # to be able to report -- without failing the job for it.
      - name: The cache environment probe can measure, and can report a negative
        run: sh .github/probes/probe.test.sh
      - name: Test the root Go module
        run: go test ./...
      - name: Vet the root Go module
        run: go vet ./...
      - name: Compile the root Go module for shipped Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o "$RUNNER_TEMP/erainfra-linux-amd64/" ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -o "$RUNNER_TEMP/erainfra-linux-arm64/" ./...
      # apps/infra-agent used to be its own Go module, so the compiler refused any import of a root
      # package and that refusal WAS the guarantee. Joining the root module removes the refusal
      # without removing the requirement: this binary runs as root on customer Nodes, and a helper
      # that innocently imports an apps/controller package would hand it containerd's transitive
      # tree with a perfectly green build. Assert on the shipped bytes rather than on go.mod —
      # go.mod is the whole platform's now, and says nothing about what this binary linked.
      - name: The Infra Agent ships exactly one dependency
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o "$RUNNER_TEMP/infra-agent" ./apps/infra-agent
          deps=$(go version -m "$RUNNER_TEMP/infra-agent" | awk '$1 == "dep" { print $2, $3 }')
          echo "$deps"
          test "$deps" = "github.com/gorilla/websocket v1.5.3"
      # Runner machines install the agent with npm, not pnpm, so its lockfile
      # has to stay in sync with its package.json. This replaces the pnpm
      # node_modules in apps/action-runner-agent, so keep it last.
      - name: Verify the agent lockfile matches its manifest
        working-directory: apps/action-runner-agent
        run: npm ci --omit=dev --no-audit --no-fund
