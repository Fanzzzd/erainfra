name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party and first-party actions alike are pinned by commit SHA: a
      # tag can be moved, a commit cannot.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Runner machines install the agent with npm, not pnpm, so its lockfile
      # has to stay in sync with its package.json. This replaces the pnpm
      # node_modules in apps/agent, so keep it last.
      - name: Verify the agent lockfile matches its manifest
        working-directory: apps/agent
        run: npm ci --omit=dev --no-audit --no-fund
