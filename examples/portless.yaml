project: demo-shop
environment: prod
network:
  provider: netmaker
  overlayCidr: 10.88.0.0/16
  containerSubnetStrategy: per-machine-/24
services:
  - name: postgres
    type: database
    image: postgres:16-alpine
    replicas: 1
    port: 5432
    resources:
      cpu: 500
      memoryMb: 1024
    placement:
      requiredRoles: [database]
      sticky: true
  - name: api
    type: web
    image: ghcr.io/example/demo-api:sha-abc123
    replicas: 2
    port: 3000
    health:
      path: /health
    resources:
      cpu: 250
      memoryMb: 256
    dependencies:
      - service: postgres
        latencySensitive: true
    connections:
      - to: assets
        type: object-storage
        provider: r2
      - to: analytics
        type: data-platform
        external: true
      - to: sessions
        type: cache
        provider: redis
    placement:
      avoidRoles: [edge]
domains:
  - hostname: api.example.com
    service: api
    ingress: cloudflare-tunnel
