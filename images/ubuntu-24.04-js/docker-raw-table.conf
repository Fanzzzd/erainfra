# Installed as /etc/systemd/system/docker.service.d/10-runner-center-raw-table.conf.
# docker-raw-table.sh explains the decision. systemd reads an EnvironmentFile=
# each time it spawns a command, after the previous unit state has finished, so
# the file ExecStartPre writes is the one dockerd starts with. The leading "-"
# is needed because systemd also reads the file for ExecStartPre itself, before
# the probe has written it on a fresh boot.
[Service]
ExecStartPre=/usr/local/lib/runner-center/docker-raw-table.sh
EnvironmentFile=-/run/runner-center/docker-raw-table.env
