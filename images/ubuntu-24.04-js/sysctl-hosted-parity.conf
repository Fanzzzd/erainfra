# Hosted parity for the kernel tunables a job can trip over (#110).
#
# A microVM guest boots the pinned 6.1 kernel with memory-proportional
# defaults, so a 2 GiB Profile got 15690 inotify watches against 655360 on
# ubuntu-latest -- and a vite or jest watcher exhausts that fast, surfacing as
# an ENOSPC that has nothing to do with disk. These two are set to the hosted
# values because a watcher's appetite scales with the repository, not with the
# Profile's RAM. The remaining memory-proportional bounds (threads-max,
# max_user_namespaces, pending signals) are left measured and pending in
# .github/conformance/allowlist.txt: a 2 GiB job that reaches those bounds has
# outgrown the Profile, not the kernel default.
fs.inotify.max_user_watches=655360
fs.inotify.max_user_instances=1280
