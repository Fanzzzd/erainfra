packages:
  - "apps/*"
  - "packages/*"

# Shared versions for dependencies that must not drift between packages.
# NOTE: apps/agent deliberately does NOT use `catalog:` — machines download that
# directory on its own and install it with plain `npm install`, which does not
# understand the `catalog:` or `workspace:` protocols.
catalog:
  "@types/node": 22.20.1
  convex: 1.43.0
  typescript: 7.0.2

allowBuilds:
  esbuild: true
