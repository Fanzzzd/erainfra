packages:
  - "apps/*"
  - "packages/*"

# Shared versions for dependencies that must not drift between packages.
# NOTE: apps/action-runner-agent deliberately does NOT use `catalog:` — machines
# download that directory on its own and install it with plain `npm install`,
# which does not understand the `catalog:` or `workspace:` protocols.
catalog:
  "@types/node": 22.20.1
  convex: 1.43.0
  typescript: 7.0.2

# apps/docs only. next@16 resolves `typescript/lib/typescript.js` during `next typegen`, and the
# native TypeScript 7 package does not ship that file. Locally the failure hides — typegen shells out
# to `pnpm install` mid-typecheck and then passes on a stale .next/types/ — but on a clean CI checkout
# it throws, exits 0 anyway, and surfaces as four TS2304s. Pin the docs site to the last TS 6-era
# release Next.js can resolve, in a NAMED catalog so nothing else can drift onto it.
catalogs:
  next-compat:
    typescript: 5.9.3

# pnpm 11 raises ERR_PNPM_IGNORED_BUILDS for any dependency with an install script that is not
# listed here, and `pnpm run` re-checks dependency status before it runs anything — so one missing
# entry fails every script in the repo, not just `pnpm install`.
allowBuilds:
  esbuild: true
  # sharp arrives with apps/docs, whose Next.js lists it as an optional dependency, and powers
  # next/image optimisation. The docs site imports no next/image and ships no raster assets, so the
  # native binary is dead weight — denied explicitly rather than left silent, because silence is what
  # pnpm 11 turns into ERR_PNPM_IGNORED_BUILDS and every script in the repo exiting 1.
  sharp: false
