packages:
  - "apps/*"
  - "packages/*"

# Shared versions for dependencies that must not drift between packages.
# NOTE: apps/action-runner-agent deliberately does NOT use `catalog:` — machines
# download that directory on its own and install it with plain `npm install`,
# which does not understand the `catalog:` or `workspace:` protocols.
catalog:
  "@types/node": 22.20.5
  convex: 1.49.0
  typescript: 7.0.2

# pnpm 11 raises ERR_PNPM_IGNORED_BUILDS for any dependency with an install script that is not
# listed here, and `pnpm run` re-checks dependency status before it runs anything — so one missing
# entry fails every script in the repo, not just `pnpm install`.
allowBuilds:
  esbuild: true
  # workerd is the Workers runtime wrangler runs locally and bundles against (packages/backend,
  # ADR 0019); its postinstall fetches the platform binary.
  workerd: true

# pnpm 12 holds back a release younger than its minimum age. The dashboard pins ui-sdk's first
# beta, published the day before it was adopted, and the root pins oxlint-tsgolint 7.0.2007,
# published two days before it was adopted. Drop these entries once each pin moves on.
minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.1"
  - "@ui-sdk/react@0.1.0-beta.1"
  - "oxlint-tsgolint@7.0.2007"
  - "@oxlint-tsgolint/darwin-arm64@7.0.2007"
  - "@oxlint-tsgolint/linux-arm64@7.0.2007"
  - "@oxlint-tsgolint/linux-x64@7.0.2007"
  - "@oxlint-tsgolint/win32-arm64@7.0.2007"
  - "@oxlint-tsgolint/win32-x64@7.0.2007"
